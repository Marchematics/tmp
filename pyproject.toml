[project]
name = "ovd_hallucination_fdr"
version = "1.0.0"
description = "Post-hoc per-family FDR control for open-vocabulary object detectors via self-normalized conformal betting e-values."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "Pillow>=10.0",
]

[project.optional-dependencies]
detectors = [
    "torch>=2.0",
    "transformers>=4.36",
    "ultralytics>=8.1",
    "pycocotools>=2.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
